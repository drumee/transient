# Drumee instance configuration — single source of truth.
#
# Copy to drumee.yaml, edit, then render the deployment artifacts:
#
#   node config/render.mjs all --config config/drumee.yaml --out-dir ./out
#
# Produces:  out/.env  out/docker-compose.yml  out/install.conf
#
# Format contract (keep it simple — the bundled parser supports this subset):
#   * 2-space indentation, exactly two levels (section -> key: value)
#   * scalars: strings, integers, true/false, null (or empty) for "generate/none"
#   * inline lists only:  key: [a, b, c]
#   * '#' starts a comment (not allowed inside an unquoted value)

instance:
  description: My Great Drumee Team
  domain: example.com
  local_mode: false
  admin_email: admin@example.com

network:
  ip4: auto                # 'auto' = detect at install time, or set e.g. 203.0.113.10
  ip6: auto
  services: []

tls:
  mode: acme               # acme | own | self-signed
  acme_email: ssl@example.com
  # own_cert_path: /etc/drumee/ssl   # required only when mode: own

storage:
  data_dir: /data
  db_dir: /srv/db
  backup_location: /srv/backup
  exchange_location: /exchangearea

database:
  host: mariadb            # 'mariadb' for containers, 'localhost' for native
  port: 3306
  name: drumee
  user: drumee-app
  password: null           # null = generate a strong random password

redis:
  host: redis
  port: 6379
  password: null

email:
  host: smtp.example.com
  port: 587
  secure: false
  user: butler
  password: null

optional_services:
  jitsi: false
  prosody: false
  coturn: false

# Reach this instance from outside without opening a port on the router. The
# node holds an outbound connection to a coordination server, which pairs it
# with clients so both sides punch their firewall at the same instant. Traffic
# is peer-to-peer and end-to-end encrypted; the relay is a fallback only.
# Native channel only — ignored when rendering docker-compose.
wireguard:
  enabled: false
  coordinator: coord.drumee.tech
  listen_port: 51820      # must stay fixed: the NAT mapping is learned from it
  reflector_port: 51821

ports:
  api: 24000             # service.js REST listener (--restPort), proxied at /-/*
  ui: 23000              # index.js page + WebSocket listener (--pushPort)

images:
  registry: ghcr.io/drumee   # where publish-images.sh pushed (use 'drumee' for local :local images)

versions:
  product: 1.0.0         # release-train version: the tag ALL images share. Pin for
                         # reproducible deploys + rollback. Use 'latest' to track newest.
  # Optional per-component overrides (default to product); normally unset:
  # server: 1.0.0
  # ui: 1.0.0
  # schemas: 1.0.0
  # static: 1.0.0

# --- Server plugins (optional) ----------------------------------------------
# Each plugin installs under /srv/drumee/runtime/plugins/server/<endpoint>/<name>
# and serves at /-/<endpoint>/svc/<module>.<method>. Listed here, they are written
# to plugins.json on render and installed automatically (drumee plugin apply).
# `source` may be a git URL (optionally #ref), a local dir, or a .tgz/.zip.
# plugins:
#   - name: hello
#     endpoint: acme
#     source: https://github.com/acme/drumee-hello.git#v1.0.0
#   - name: local-tool
#     endpoint: acme
#     source: ./my-plugins/local-tool
#
# Or manage them imperatively any time (native: `drumee plugin …`):
#   drumee-ctl plugin add https://github.com/acme/drumee-hello.git#v1.0.0 --endpoint=acme
#   drumee-ctl plugin list | remove acme/hello | disable acme/hello
