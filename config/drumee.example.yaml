# Drumee instance configuration — single source of truth.
#
# Copy to drumee.yaml, edit, then render the deployment artifacts:
#
#   node config/render.mjs all --config config/drumee.yaml --out-dir ./out
#
# Produces:  out/.env  out/docker-compose.yml  out/install.conf
#
# Format contract (keep it simple — the bundled parser supports this subset):
#   * 2-space indentation, exactly two levels (section -> key: value)
#   * scalars: strings, integers, true/false, null (or empty) for "generate/none"
#   * inline lists only:  key: [a, b, c]
#   * '#' starts a comment (not allowed inside an unquoted value)

instance:
  description: My Great Drumee Team
  domain: example.com
  local_mode: false
  admin_email: admin@example.com

network:
  ip4: auto                # 'auto' = detect at install time, or set e.g. 203.0.113.10
  ip6: auto
  services: []

tls:
  mode: acme               # acme | own | self-signed
  acme_email: ssl@example.com
  # own_cert_path: /etc/drumee/ssl   # required only when mode: own

storage:
  data_dir: /data
  db_dir: /srv/db
  backup_location: /srv/backup
  exchange_location: /exchangearea

database:
  host: mariadb            # 'mariadb' for containers, 'localhost' for native
  port: 3306
  name: drumee
  user: drumee-app
  password: null           # null = generate a strong random password

redis:
  host: redis
  port: 6379
  password: null

email:
  host: smtp.example.com
  port: 587
  secure: false
  user: butler
  password: null

optional_services:
  jitsi: false
  prosody: false
  coturn: false

ports:
  api: 24000             # service.js REST listener (--restPort), proxied at /-/*
  ui: 23000              # index.js page + WebSocket listener (--pushPort)

versions:
  server: 2.9.44
  ui: 3.2.49
  schemas: 2.6.99
  static: 1.0.3
