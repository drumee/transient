<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DrumeeOS is now ready</title>
  <style nonce>
    @font-face {
      font-family: 'Armin Grotesk';

      font-weight: 200;
      src: url(/-/fonts/armin-grotesk/armin-grotesk-ultra-light.otf) format('opentype');
    }

    @font-face {
      font-family: 'Armin Grotesk';
      font-style: italic;
      font-weight: 200;
      src: url(/-/fonts/armin-grotesk/armin-grotesk-ultra-light-italic) format('opentype');
    }

    @font-face {
      font-family: 'Armin Grotesk';
      font-style: normal;
      font-weight: normal;
      src: url(/-/fonts/armin-grotesk/armin-grotesk-normal.otf) format('opentype');
    }

    @font-face {
      font-family: 'Armin Grotesk';
      font-style: italic;
      font-weight: normal;
      src: url(/-/fonts/armin-grotesk/armin-grotesk-italic.otf) format('opentype');
    }

    @font-face {
      font-family: 'Armin Grotesk';
      font-style: normal;
      font-weight: 600;
      src: url(/-/fonts/armin-grotesk/armin-grotesk-semi-bold-italic.otf) format('opentype');
    }

    @font-face {
      font-family: 'Armin Grotesk';
      font-style: italic;
      font-weight: 600;
      src: url(/-/fonts/armin-grotesk/armin-grotesk-semi-bold-italic.otf) format('opentype');
    }

    @font-face {
      font-family: 'Armin Grotesk';
      font-style: normal;
      font-weight: 800;
      src: url(/-/fonts/armin-grotesk/armin-grotesk-ultra-bold.otf) format('opentype');
    }

    @font-face {
      font-family: 'Armin Grotesk';
      font-style: italic;
      font-weight: 600;
      src: url(/-/fonts/armin-grotesk/armin-grotesk-ultra-bold-italic.otf) format('opentype');
    }
  </style>
  <style>
    .f_03_span {
      color: var(--Neutral-900, #222732);
      font-size: 20px;
      font-family: Armin Grotesk;
      font-weight: 400;
      line-height: 30px;
      letter-spacing: 0.20px;
      word-wrap: break-word;
    }

    .text-1_03 {
      align-self: stretch;
      text-align: center;
    }

    .symbol {
      left: 1.20px;
      top: 2.25px;
      position: absolute;
    }

    .frame-1_02 {
      width: 83px;
      height: 72px;
      position: relative;
    }

    .frame-1_01 {
      width: 455px;
      padding: 32px;
      border-radius: 32px;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 16px;
      display: inline-flex;
      width: 455px;
      padding: 32px;
      background: var(--Gray-White, white);
      border-radius: 24px;
      outline: 1px var(--Neutral-200, #EBECF0) solid;
      outline-offset: -1px;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 32px;
      display: inline-flex
    }

    .frame-1 {
      width: 100vw;
      height: 100vh;
      position: relative;
      background: var(--Neutral-100, #F4F4F6);
      overflow: hidden;
      border-radius: 32px;
      display: flex;
      flex-direction: column;
      align-content: center;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      background: var(--Neutral-100, #F4F4F6);
      overflow: hidden;
      border-radius: 32px;
    }

    .link {
      font-size: 20px;
      font-family: Armin Grotesk;
      font-weight: 400;
      line-height: 30px;
    }

    .button {
      height: 48px;
      padding-top: 8px;
      padding-bottom: 8px;
      padding-left: 24px;
      padding-right: 4px;
      background: var(--Primary-500, #B251FB);
      border-radius: 1000px;
      justify-content: flex-start;
      align-items: center;
      gap: 12px;
      display: flex;
      width: 100%;
    }

    .button-icon {
      width: 40px;
      height: 40px;
      padding: 8px;
      background: var(--Gray-White, white);
      border-radius: 1000px;
      justify-content: center;
      align-items: center;
      gap: 8px;
      display: flex;
    }

    .button-anchor {
      text-align: center;
      justify-content: center;
      display: flex;
      flex-direction: row;
      color: var(--Gray-White, white);
      font-size: 16px;
      font-family: Armin Grotesk;
      font-weight: 600;
      line-height: 26px;
      letter-spacing: 0.16px;
      word-wrap: break-word;
      width: 100%;
    }

    .button-text {
      display: flex;
      white-space: nowrap;
      line-height: 34px;
      flex-direction: row;
      justify-content: flex-start;
      align-content: center;
      flex-wrap: wrap;
      padding: 10px;
    }

    .button-container {
      align-self: stretch;
      justify-content: center;
      align-items: center;
      gap: 12px;
      display: flex;
      flex-wrap: wrap;
      flex-direction: row;
      width: 100%;
    }

    .button-content {
      justify-content: center;
      align-items: center;
      gap: 24px;
      display: flex;
      width: 100%;
      align-self: stretch;
      justify-content: center;
      align-items: center;
      flex-direction: row;
      align-content: center;
      flex-wrap: wrap;
    }

    .icon {
      width: 40px;
      height: 40px;
      padding: 8px;
      background: var(--Gray-White, white);
      border-radius: 1000px;
      justify-content: center;
      align-items: center;
      gap: 8px;
      display: flex;
      flex-direction: row;
      justify-items: center;
      align-content: center;
      flex-wrap: wrap;
    }
  </style>

</head>

<body>
  <div class="frame-1">
    <div class="frame-1_01">
      <div class="frame-1_02">

      </div>
      <div

        <div
          style="align-self: stretch; flex-direction: column; justify-content: flex-start; align-items: flex-start; gap: 4px; display: flex">
          <div
            style="align-self: stretch; text-align: center; color: var(--Neutral-900, #222732); font-size: 32px; font-family: Armin Grotesk; font-weight: 600; line-height: 40px; word-wrap: break-word">
            Great job! <br />You’re ready to dive in</div>
          <div
            style="align-self: stretch; text-align: center; justify-content: center; display: flex; flex-direction: column; color: var(--Neutral-600, #8C929C); font-size: 16px; font-family: Armin Grotesk; font-weight: 400; line-height: 26px; letter-spacing: 0.16px; word-wrap: break-word">
            DrumeeOS is now ready.<br />Let’s begin exploring and shaping your experience.</div>
        </div>
        <div class="button-container">
          <div class="button-content">
            <div data-layer="Button" data-hierarchy="Website" data-icon="None" data-size="48px" data-state="Normal"
              class="button">
              <a href="<%= home %>" class="button-anchor">
                <div class="button-text">Go to DrumeeOS</div>
                <div data-layer="2" class="button-icon">
                  <div data-svg-wrapper data-layer="Icon" data-name="Right" class="icon" style="position: relative">
                    <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                      <path

                    </svg>
                  </div>
                </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>

</html>
