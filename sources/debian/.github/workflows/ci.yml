name: CI

on:
  pull_request:
  push:
    branches: [main, 'feat/**']

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shell syntax (bash -n)
        run: |
          fail=0
          while IFS= read -r f; do
            bash -n "$f" || { echo "syntax error: $f"; fail=1; }
          done < <(git ls-files '*.sh' 'bin/*' | grep -v '/src/')
          exit $fail
      - name: ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          severity: warning
          ignore_paths: builder/src target

  # One comprehensive suite: render + compose validity + config smoke + the
  # installer wizard (render-only) + native packaging metadata + version drift.
  # No private source / images / VM needed — runs on every push and PR.
  suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Full test suite (tests/run-all.sh)
        run: tests/run-all.sh
