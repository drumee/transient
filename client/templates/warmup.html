<style>

    letter-spacing: 0.20px;
    word-wrap: break-word;

  .warming-up-text[data-state="reverse"] {

  .progress {

    position: relative;
  }

  .symbol {

  }

    height: 72px;

  }

    width: 455px;
    padding: 32px;
    border-radius: 32px;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 16px;
    display: inline-flex;
  }

  .frame-1 {
    width: 100vw;
    height: 100vh;
    position: relative;
    background: var(--Neutral-100, #F4F4F6);

    justify-content: center;
