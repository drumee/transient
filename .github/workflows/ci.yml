name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shell syntax (bash -n)
        run: |
          fail=0
          while IFS= read -r f; do
            bash -n "$f" || { echo "syntax error: $f"; fail=1; }
          done < <(git ls-files '*.sh' 'bin/*' | grep -v '/src/')
          exit $fail
      - name: ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          severity: warning
          ignore_paths: builder/src target

  config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: render.mjs parses
        run: node --check config/render.mjs
      - name: Render example config
        run: |
          cp config/drumee.example.yaml config/drumee.yaml
          node config/render.mjs validate --config config/drumee.yaml >/dev/null
          node config/render.mjs all --config config/drumee.yaml --out-dir out
      - name: docker compose config is valid
        run: |
          cp deploy/docker/Caddyfile out/Caddyfile
          docker compose -f out/docker-compose.yml --env-file out/.env config -q
          echo "compose OK"

  versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Release manifest matches changelogs
        run: scripts/check-versions.sh
