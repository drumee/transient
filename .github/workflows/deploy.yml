name: CD - deploy server-team

on:
  push:
    branches: [preview, test]
  workflow_dispatch:
    inputs:
      target:
        description: 'Deploy target environment'
        type: choice
        options: [UAT, TEST, PROD]
        default: UAT

concurrency:
  # Repo-wide group: all targets share one working tree (container for UAT/PROD,
  # stage host for TEST), so deploys must serialize regardless of target/branch.
  group: cd-server-team
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy
    runs-on: self-hosted
    timeout-minutes: 15
    env:
      SGP_USER: debian
      SGP_HOST: sgp
      CONTAINER: drumee
      REPO_PATH: /usr/src/drumee/server-team
      LOG_FILE: /tmp/cd-server-${{ github.run_id }}.log
    steps:
      - name: Resolve target
        id: target
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            case "${{ github.ref_name }}" in
              test)    TARGET=TEST ;;
              preview) TARGET=UAT ;;
              *) echo "Unsupported push branch: ${{ github.ref_name }}"; exit 1 ;;
            esac
          else
            TARGET="${{ github.event.inputs.target || 'UAT' }}"
          fi
          # MODE=stage  -> deploy locally on the runner host (drumee.in), endpoint `main` (native pm2)
          # MODE=container -> deploy into the prod box (sgp) docker container
          case "$TARGET" in
            PROD) ENV_FILE=production; EP=main;    PORT=24000; BRANCH=preview; MODE=container ;;
            TEST) ENV_FILE=deploy;     EP=main;    PORT=24000; BRANCH=test;    MODE=stage ;;
            UAT)  ENV_FILE=deploy;     EP=preview; PORT=24001; BRANCH=preview; MODE=container ;;
            *) echo "Unknown target: $TARGET"; exit 1 ;;
          esac
          echo "env_file=$ENV_FILE" >> "$GITHUB_OUTPUT"
          echo "endpoint=$EP"       >> "$GITHUB_OUTPUT"
          echo "port=$PORT"         >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH"     >> "$GITHUB_OUTPUT"
          echo "mode=$MODE"         >> "$GITHUB_OUTPUT"
          echo "::notice::Target $TARGET -> endpoint $EP (branch $BRANCH, mode $MODE)"

      # ---------------- TEST: deploy to drumee.in (stage) `main` endpoint, native ----------------
      - name: Deploy to stage main (TEST)
        id: stage
        if: steps.target.outputs.mode == 'stage'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_DIR: /usr/src/drumee/server-team
        run: |
          set -euo pipefail
          AUTH="https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          [ -d "$REPO_DIR/.git" ] || sudo git init -q "$REPO_DIR"
          PREV=$(sudo git -C "$REPO_DIR" rev-parse HEAD 2>/dev/null || echo "")
          echo "prev=$PREV" >> "$GITHUB_OUTPUT"
          sudo git -C "$REPO_DIR" fetch --depth 1 "$AUTH" test
          sudo git -C "$REPO_DIR" checkout -f -B test FETCH_HEAD
          sudo git -C "$REPO_DIR" reset --hard FETCH_HEAD
          sudo git -C "$REPO_DIR" clean -fd -e .dev-tools.rc || true
          echo "Deploying $(sudo git -C "$REPO_DIR" rev-parse --short HEAD) to stage main"
          sudo bash -c "cd '$REPO_DIR' && npm install --no-audit --no-fund"
          sudo bash -c "cd '$REPO_DIR' && npm run deploy -- deploy"
          sudo /usr/sbin/drumee start main
          sudo /usr/sbin/drumee start main/service
          # Offline workers run as separate pm2 apps and keep old code in
          # memory until restarted; bounce every one declared in the ecosystem.
          for W in indexWorker gdriveWorker trashWorker expiryWorker reminderWorker versionRetentionWorker; do
            sudo /usr/sbin/drumee start "$W" \
              && echo "worker $W restarted" \
              || echo "worker $W not configured, skipped"
          done

      - name: Verify stage main (TEST)
        if: steps.target.outputs.mode == 'stage'
        run: |
          set -euo pipefail
          sleep 6
          CODE=$(curl -sk -o /dev/null -w '%{http_code}' --max-time 10 -H 'Host: drumee.in' https://localhost/-/ || echo 000)
          echo "stage main HTTP: $CODE"
          [[ "$CODE" =~ ^[2-4][0-9][0-9]$ ]] || { echo "::error::stage main verify failed ($CODE)"; exit 1; }
          echo "Verified stage main (server-team test)"

      - name: Rollback stage (on failure)
        if: failure() && steps.target.outputs.mode == 'stage' && steps.stage.outputs.prev != ''
        env:
          REPO_DIR: /usr/src/drumee/server-team
          PREV: ${{ steps.stage.outputs.prev }}
        run: |
          set -uo pipefail
          echo "::warning::Rolling back stage main to ${PREV:0:8}"
          sudo git -C "$REPO_DIR" reset --hard "$PREV"
          sudo bash -c "cd '$REPO_DIR' && npm run deploy -- deploy" || true
          sudo /usr/sbin/drumee start main || true
          sudo /usr/sbin/drumee start main/service || true
          for W in indexWorker gdriveWorker trashWorker expiryWorker reminderWorker versionRetentionWorker; do
            sudo /usr/sbin/drumee start "$W" || true
          done

      # ---------------- UAT / PROD: deploy into prod box (sgp) container ----------------
      - name: Fetch and reset working tree
        id: fetch
        if: steps.target.outputs.mode == 'container'
        env:
          BRANCH: ${{ steps.target.outputs.branch }}
        run: |
          OUTPUT=$(ssh "$SGP_USER@$SGP_HOST" "sudo docker exec -i $CONTAINER bash -s" <<EOSSH
          set -euo pipefail
          cd $REPO_PATH
          PREV=\$(git rev-parse HEAD)
          echo "PREV=\$PREV"
          git fetch origin $BRANCH --quiet
          git checkout -f $BRANCH --quiet
          git reset --hard origin/$BRANCH --quiet
          git clean -fd --quiet >/dev/null 2>&1 || true
          NEW=\$(git rev-parse HEAD)
          echo "NEW=\$NEW"
          EOSSH
          )
          PREV=$(echo "$OUTPUT" | grep '^PREV=' | cut -d= -f2)
          NEW=$(echo "$OUTPUT"  | grep '^NEW='  | cut -d= -f2)
          echo "prev=$PREV" >> "$GITHUB_OUTPUT"
          echo "new=$NEW"   >> "$GITHUB_OUTPUT"
          echo "Previous: ${PREV:0:8}"
          echo "New     : ${NEW:0:8}"

      - name: Install dependencies
        if: steps.target.outputs.mode == 'container'
        run: |
          ssh "$SGP_USER@$SGP_HOST" "sudo docker exec -i $CONTAINER bash -s" <<EOSSH
          set -euo pipefail
          cd $REPO_PATH
          if ! npm install --no-audit --no-fund > $LOG_FILE 2>&1; then
            echo "::error::npm install failed. Tail of log:"
            tail -50 $LOG_FILE
            exit 1
          fi
          echo "Dependencies installed"
          EOSSH

      - name: Deploy
        if: steps.target.outputs.mode == 'container'
        env:
          ENV_FILE: ${{ steps.target.outputs.env_file }}
        run: |
          ssh "$SGP_USER@$SGP_HOST" "sudo docker exec -i $CONTAINER bash -s" <<EOSSH
          set -euo pipefail
          cd $REPO_PATH
          if ! npm run deploy -- $ENV_FILE > $LOG_FILE 2>&1; then
            echo "::error::Deploy command failed. Tail of log:"
            tail -50 $LOG_FILE
            exit 1
          fi
          echo "Deploy succeeded"
          EOSSH

      - name: Start services
        if: steps.target.outputs.mode == 'container'
        env:
          EP: ${{ steps.target.outputs.endpoint }}
        run: |
          ssh "$SGP_USER@$SGP_HOST" "sudo docker exec -i $CONTAINER bash -s" <<EOSSH
          set -euo pipefail
          /usr/sbin/drumee start $EP         >> $LOG_FILE 2>&1
          /usr/sbin/drumee start $EP/service >> $LOG_FILE 2>&1
          echo "drumee start issued for $EP and $EP/service"
          # Offline workers (indexing, gdrive migration, trash/expiry/...) are
          # separate pm2 apps shared by the container; restart them so they
          # pick up the deployed code instead of keeping the old build in RAM.
          for W in indexWorker gdriveWorker trashWorker expiryWorker reminderWorker versionRetentionWorker; do
            /usr/sbin/drumee start "\$W" >> $LOG_FILE 2>&1 \
              && echo "worker \$W restarted" \
              || echo "worker \$W not configured, skipped"
          done
          EOSSH

      - name: Verify HTTP
        if: steps.target.outputs.mode == 'container'
        env:
          PORT: ${{ steps.target.outputs.port }}
          EP: ${{ steps.target.outputs.endpoint }}
        run: |
          ssh "$SGP_USER@$SGP_HOST" "sudo docker exec -i $CONTAINER bash -s" <<EOSSH
          set -euo pipefail
          sleep 5
          HTTP_CODE=\$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "http://localhost:$PORT/" || echo 000)
          echo "HTTP code: \$HTTP_CODE"
          if [[ ! "\$HTTP_CODE" =~ ^[2-4][0-9][0-9]\$ ]]; then
            echo "::error::Verify failed for endpoint $EP (5xx or unreachable)"
            exit 1
          fi
          echo "Verified endpoint $EP"
          EOSSH

      - name: Rollback (on failure)
        if: failure() && steps.target.outputs.mode == 'container' && steps.fetch.outputs.prev != ''
        env:
          ENV_FILE: ${{ steps.target.outputs.env_file }}
          PREV: ${{ steps.fetch.outputs.prev }}
        run: |
          ssh "$SGP_USER@$SGP_HOST" "sudo docker exec -i $CONTAINER bash -s" <<EOSSH
          set -uo pipefail
          cd $REPO_PATH
          echo "::warning::Rolling back to ${PREV:0:8}"
          git reset --hard $PREV --quiet
          if npm run deploy -- $ENV_FILE > $LOG_FILE 2>&1; then
            echo "Rollback succeeded"
          else
            echo "::error::Rollback redeploy ALSO failed. Tail:"
            tail -50 $LOG_FILE
            exit 1
          fi
          EOSSH
