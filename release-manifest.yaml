# Coherent release manifest — the authoritative version of each package in a
# release set. `scripts/check-versions.sh` verifies every debian/changelog matches
# this file, so the components release as a coherent set instead of drifting.
#
# Format: <dir>: <version>   (the package name is read from each changelog)
# Bump here, then run: scripts/check-versions.sh --sync   to update changelogs.
#
# `product` is the single user-facing release-train version. It is the version of
# the `drumee` metapackage, the tag all container images are published under
# (:<product> + :stable + :latest), and what `drumee.yaml`'s `version:` pins to.
# Component versions below are internal; users only ever see `product`.

product: 1.0.0

infra: 1.2.11
schemas: 2.6.99
server: 2.9.73
ui: 3.3.50
static: 1.0.4
schemas-patch: 1.1.6
builder: 1.2.6
meta: 1.0.0
